<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title> Reset Password</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link th:href="@{/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@600&family=Lobster+Two:wght@700&display=swap"
          rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <!--    font awesome toolkit-->
    <script src="https://kit.fontawesome.com/f2c9afeedf.js" crossorigin="anonymous"></script>
    <style>
        .sign-in {
            border-radius: 15px;
            box-shadow: 2px 6px 8px rgba(0, 0, 0, 0.2);
            padding: 10px;
            background: white;
        }
    </style>
</head>
<body>

<!--Adding Navbar fragment to this page-->
<div th:replace="~{navbar-fragment :: navbar}"></div>

<div class="container-xxl bg-white p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->
    <div class="container pt-5">
        <!--    <hr>-->
        <div class="card mx-auto w-50 border-0 mt-2 rounded-2 sign-in">
            <div class="fw-bold text-danger bg-light text-center">
                <i class="fa-solid fa-lock d-block pt-3 fs-2"></i>
                <h2>Reset Password</h2>
            </div>

            <div class="px-4 pb-3 bg-light">
                <!--           Handling Custom Error Messages if there are some login issues.-->
                <div>
                    <!--                   for displaying logout-->
                    <div th:if="${userNotFound}"
                         class="p-2 mb-3 text-danger bg-danger-subtle border border-success-subtle rounded-3">
                        Error: invalid username
                    </div>
                    <!--                    successful registration message -->
                    <div th:if="${successMessage}"
                         class="p-2 mb-3 text-success bg-success-subtle border border-success-subtle rounded-3">
                        Password Reset Successful. Sign-in back to continue.
                    </div>
                </div>
                <form action="#" th:action="@{/reset-user-password}" th:object="${resetPassword}" method="post">
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Username"
                                   autocomplete="off" th:classappend="${#fields.hasErrors('username')?'is-invalid':''}"
                                   th:value="*{username}">
                            <label for="username">User Name</label>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                 th:errors="${resetPassword.username}"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="password" class="form-control" name="password" id="password"
                                   placeholder="Password"
                                   th:classappend="${#fields.hasErrors('password')?'is-invalid':''}"
                                   th:value="*{password}">
                            <label for="password">New Password</label>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="${resetPassword.password}"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="password" class="form-control" name="confirmPassword" id="retype-password"
                                   placeholder="retype-password"
                                   th:classappend="${#fields.hasErrors('confirmPassword')?'is-invalid':''}"
                                   th:value="*{confirmPassword}">
                            <label for="password">Re-type Password</label>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="${resetPassword.confirmPassword}"></div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary w-100 me-auto rounded-pill">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
        <a th:href="@{/show-login}" class="btn btn-warning text-white">Back to Sign-in</a>
    </div>

</div>


<!--        Adding Footer Fragment-->
<div th:replace="~{footer-fragment::footer}"></div>


<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>


</body>
</html>
