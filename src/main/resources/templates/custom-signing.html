<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Kider Custom Sign-in </title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link th:href="@{/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@600&family=Lobster+Two:wght@700&display=swap"
          rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!--Adding Navbar fragment to this page-->
<div th:replace="~{navbar-fragment :: navbar}"></div>

<div class="container-xxl bg-white p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->
<!--    &lt;!&ndash; Page Header End &ndash;&gt;-->
<!--    <div class="container-xxl py-5 page-header position-relative mb-5">-->
<!--        <div class="container py-5">-->
<!--            <h1 class="display-2 text-white animated slideInDown mb-4">Sign in</h1>-->
<!--            <nav aria-label="breadcrumb animated slideInDown">-->
<!--                <ol class="breadcrumb">-->
<!--                    <li class="breadcrumb-item "><a class="text-info" href="#">Home</a></li>-->
<!--                    <li class="breadcrumb-item "><a class="text-info" href="#">Pages</a></li>-->
<!--                    <li class="breadcrumb-item text-white active" aria-current="page">Sign in</li>-->
<!--                </ol>-->
<!--            </nav>-->
<!--        </div>-->
<!--    </div>-->
<!--    &lt;!&ndash; Page Header End &ndash;&gt;-->

    <div class="container py-5">
        <!--    <hr>-->
        <div class="card mx-auto w-50 border border-2 border-info mt-2 rounded-2">
            <div class="card-header bg-info fw-bold text-white">
                <h1><i class="fa fa-book-reader me-3"></i>Sign-in</h1>
            </div>

            <div class="p-4">
                <!--           Handling Custom Error Messages if there are some login issues.-->
                <div class="mb-1">
                    <!--                   for displaying error-->
                    <div th:if="${param.error}"
                         class="p-2 text-danger bg-danger-subtle border border-danger-subtle rounded-3">
                        You have entered either wrong username or password!.
                    </div>
                    <!--                   for displaying logout-->
                    <div th:if="${param.logout}"
                         class="p-2 text-success bg-success-subtle border border-success-subtle rounded-3">
                        You are logged out successfully!.
                    </div>
                </div>
                <form action="#" th:action="@{/authenticateTheUser}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">User Name</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter username"
                               autocomplete="off">

                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" id="password"
                               placeholder="Enter password">
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-success w-25 me-auto rounded-pill">Sign In</button>
                        <div>
                            <a class="d-block" th:href="@{/register/showRegistration}">
                                Don't have account?
                            </a>
                            <a class="text-decoration-none d-block text-primary fw-semibold" th:href="@{/register/showRegistration}">Create Account</a>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>

</div>


<!--        Adding Footer Fragment-->
<div th:replace="~{footer-fragment::footer}"></div>


<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/lib/wow/wow.min.js}"></script>
<script th:src="@{/lib/easing/easing.min.js}"></script>
<script th:src="@{/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/js/main.js}"></script>


</body>
</html>
