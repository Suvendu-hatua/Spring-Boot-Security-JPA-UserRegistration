<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Kider - Teacher Appointment</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@600&family=Lobster+Two:wght@700&display=swap"
          rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
    <script>
        setTimeout(function () {
            document.getElementById("content").style.display = "none";
        }, 5000); // 5000 milliseconds = 5 seconds
    </script>
</head>

<body>
<!--Adding navbar section fragment-->
<div th:replace="~{navbar-fragment::navbar}"></div>

<div class="container-xxl bg-white p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!-- Spinner End -->

    <!-- Page Header End -->
    <div class="container-xxl py-5 page-header position-relative mb-5">
        <div class="container py-5">
            <h1 class="display-2 text-white animated slideInDown mb-4">Teacher Appointment</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a class="text-info" href="#">Home</a></li>
                    <li class="breadcrumb-item"><a class="text-info" href="#">Pages</a></li>
                    <li class="breadcrumb-item"><a class="text-info" href="#">Become a Teachers</a></li>
                    <li class="breadcrumb-item text-white active" aria-current="page">Appointment</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End -->

    <!-- Successful form submission -->
    <div th:if="${status}" id="content" class="p-3 text-success bg-success-subtle border border-success-subtle rounded-3">
        Your application is submitted successfully. We will review your application and conect with you soon.
        <!-- <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> -->
    </div>

    <!-- Appointment Start -->
    <div class="py-5">
        <div class="container bg-light row g-0 rounded">
            <div class="col-lg-6 wow fadeIn" data-wow-delay="0.1s">
                <div class="h-100 d-flex flex-column justify-content-center p-5">
                    <h1 class="mb-4">Submit Your Application</h1>
                    <form th:action="@{/submit-job-application}" th:object="${applicant}" method="post">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="fname" name="firstName" placeholder="First Name"
                                           autocomplete="off" th:classappend="${#fields.hasErrors('firstName')?'is-invalid':''}"
                                            th:value="*{firstName}">
                                    <label for="fname">First Name</label>
                                </div>
                                <!--                   Handling form field errors-->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}"
                                     th:errors="${applicant.firstName}"></div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="lname" name="lastName"  placeholder="Last Name"
                                           autocomplete="off" th:classappend="${#fields.hasErrors('lastName')?'is-invalid':''}"
                                           th:value="*{lastName}">
                                    <label for="lname">Last Name</label>
                                </div>
                                <!--                   Handling form field errors-->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}"
                                     th:errors="${applicant.lastName}"></div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="gmail" name="email" placeholder="Email"
                                           autocomplete="off" th:classappend="${#fields.hasErrors('email')?'is-invalid':''}"
                                           th:value="*{email}">
                                    <label for="gmail">Email</label>
                                </div>
                                <!--                   Handling form field errors-->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="${applicant.email}"></div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="phoneno" name="mobileNo"
                                           placeholder="Phone Number" th:classappend="${#fields.hasErrors('mobileNo')?'is-invalid':''}"
                                           th:value="*{mobileNo}">
                                    <label for="phoneno">Phone Number</label>
                                </div>
                                <!--                   Handling form field errors-->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('mobileNo')}"
                                     th:errors="${applicant.mobileNo}"></div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="address" name="address" placeholder="Address">
                                    <label for="address">Address</label>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="qualification" name="qualification"
                                           placeholder="Qualification" th:classappend="${#fields.hasErrors('qualification')?'is-invalid':''}"
                                           th:value="*{qualification}">
                                    <label for="qualification">Qualification</label>
                                </div>
                                <!--                   Handling form field errors-->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('qualification')}"
                                     th:errors="${applicant.qualification}"></div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <select id="position" class="form-select" name="applyingFor"
                                            aria-label="Default select example">
                                        <option>Select an option</option>
                                        <option value="Art & Drawing">Art & Drawing</option>
                                        <option value="Dance Teacher">Dance Teacher</option>
                                        <option value="English Teacher">English Teacher</option>
                                    </select>
                                    <label for="position" class="form-label">Applying For</label>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label fw-semibold">Gender</label>
                                <div class="form-floating">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"
                                               name="gender" id="gender" field="*{gender}" value="Male">
                                        <label class="form-check-label" for="gender">Male</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio"
                                               name="gender" id="inlineRadio2" field="*{gender}" value="Female">
                                        <label class="form-check-label"
                                               for="inlineRadio2">Female</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="">
                                    <label class="fw-semibold mb-1" for="resume">Resume</label>
                                    <input type="file" accept=".pdf,.docx" name="resume" class="form-control" id="resume"
                                           placeholder="Resume">
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                            <textarea class="form-control" placeholder="Leave a message here"
                                                      id="message" name="message" style="height: 100px"></textarea>
                                    <label for="message">Message</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary w-100 py-3" type="submit">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-lg-6 wow fadeIn" data-wow-delay="0.5s" style="min-height: 400px;">
                <div class="position-relative h-100">
                    <img class="position-absolute w-100 h-100 rounded" src="img/teacher.jpg"
                         style="object-fit: cover;">
                </div>
            </div>
        </div>
    </div>

<!-- Appointment End -->

<!-- Back to Top -->
<a href="#" class="btn btn-lg btn-info text-white btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
</div>

<!--    Adding footer section fragment-->
<div th:replace="~{footer-fragment::footer}"></div>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="lib/wow/wow.min.js"></script>
<script src="lib/easing/easing.min.js"></script>
<script src="lib/waypoints/waypoints.min.js"></script>
<script src="lib/owlcarousel/owl.carousel.min.js"></script>

<!-- Template Javascript -->
<script src="js/main.js"></script>
</body>

</html>
