<!--Adding Header(Navbar ) Fragment to page-->
<div th:replace="~{navbar-fragment::navbar}"></div>

<div class="container-xxl bg-white p-0">
    <!-- Spinner Start -->
    <div id="spinner"
         class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <!--     Spinner End -->
    <!-- Page Header End -->
    <div class="container-xxl py-5 page-header position-relative mb-5">
        <div class="container py-5">
            <h1 class="display-2 text-white animated slideInDown mb-4">Create Account</h1>
            <nav aria-label="breadcrumb animated slideInDown">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item "><a class="text-info" href="#">Home</a></li>
                    <li class="breadcrumb-item "><a class="text-info" href="#">Pages</a></li>
                    <li class="breadcrumb-item text-white active" aria-current="page">Create Account</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End -->
    <div class="bg-light rounded">
        <div class=" wow fadeIn" data-wow-delay="0.1s">
            <div class="h-100 d-flex flex-column justify-content-center p-5">
                <h1 class="mb-4">Create Account</h1>
                <form th:action="@{/register/submit-registration}"  th:object="${guardian}" method="post">
                    <div th:if="${registrationError}"
                         class="p-2 text-danger bg-danger-subtle border border-danger-subtle rounded-3">
                        <span th:text="${message}"></span>
                    </div>
                    <div class="row g-3">
                        <!--                            username                      -->
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="username" name="userName"
                                       placeholder="Enter username"
                                       th:classappend="${#fields.hasErrors('userName')?'is-invalid':''}"
                                       autocomplete="off"
                                       th:value="*{userName}">
                                <label for="username">User Name</label>
                            </div>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('userName')}"
                                 th:errors="${guardian.userName}"></div>
                        </div>
                        <!--                            password                    -->
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input type="password" class="form-control" id="password" name="password"
                                       th:classappend="${#fields.hasErrors('password')?'is-invalid':''}"
                                       placeholder="Password">
                                <label for="password">Password</label>
                            </div>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                 th:errors="${guardian.password}"></div>
                        </div>
                        <!--                        Guardian Name                   -->
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="guardianName"
                                       name="guardianName" placeholder="Guardian Name"
                                       th:classappend="${#fields.hasErrors('guardianName')?'is-invalid':''}"
                                       autocomplete="off" th:value="*{guardianName}">
                                <label for="guardianName">Guardian Name</label>
                            </div>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('guardianName')}"
                                 th:errors="${guardian.guardianName}"></div>
                        </div>
                        <!--                        Guardian Email              -->
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="guardianEmail"
                                       name="guardianEmail"
                                       placeholder="Guardian Email"
                                       th:classappend="${#fields.hasErrors('guardianEmail')?'is-invalid':''}"
                                       autocomplete="off" th:value="*{guardianEmail}">
                                <label for="guardianEmail" class="form-label">Guardian Email</label>
                            </div>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('guardianEmail')}"
                                 th:errors="${guardian.guardianEmail}"></div>
                        </div>
                        <!--                        Guardian Mobile Number                  -->
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="mobileNo" name="mobileNo"
                                       placeholder="Mobile Number"
                                       th:classappend="${#fields.hasErrors('mobileNo')?'is-invalid':''}"
                                       autocomplete="off" th:value="*{mobileNo}">
                                <label for="mobileNo">Mobile Number</label>
                            </div>
                            <!--                   Handling form field errors-->
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('mobileNo')}"
                                 th:errors="${guardian.mobileNo}"></div>
                        </div>
                        <!--                        country                 -->
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <select id="country" class="form-select" name="country"
                                        aria-label="Default select example">
                                    <option>Select an option</option>
                                    <option th:each="tempCountry:${countryList}"
                                            th:text="${tempCountry}"
                                            th:value="${tempCountry}"
                                            th:selected="${guardian.country==tempCountry?true:false}">
                                    </option>
                                </select>
                                <label for="country" class="form-label">Country</label>
                            </div>
                        </div>
                        <!--                        Address                 -->
                        <div class="col-12">
                            <div class="form-floating">
                                            <textarea class="form-control border-0" placeholder="Leave a message here"
                                                      id="address" name="address" style="height: 100px"
                                                      autocomplete="off" th:value="*{address}"></textarea>
                                <label for="address">Address</label>
                            </div>
                        </div>
                        <!--                        terms and Conditions            -->
                        <div class="col-12">
                            <div class="mb-1 form-check">
                                <input type="checkbox" class="form-check-input" id="isAgreed" name="selected"
                                       th:classappend="${#fields.hasErrors('selected')?'is-invalid':''}">
                                <label class="form-check-label" for="isAgreed">Please Accept <a href="">Trams and
                                    Conditions</a></label>
                                <!--                   Handling form field errors-->
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('selected')}"
                                     th:errors="${guardian.selected}"></div>
                            </div>
                        </div>
                        <!--                        submit button           -->
                        <div class="col-12">
                            <button class="btn btn-primary w-100 py-3" type="submit">Submit</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

</div>
